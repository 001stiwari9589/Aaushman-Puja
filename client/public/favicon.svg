<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF0CA"/>
      <stop offset="50%" stop-color="#F5B91B"/>
      <stop offset="100%" stop-color="#30170D"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="46" fill="#160D09" stroke="#F5B91B" stroke-width="3"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#DCA52A" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Sacred Om Glyphs -->
  <text x="50" y="65" font-family="'Cinzel', serif" font-size="44" font-weight="bold" fill="#F5B91B" text-anchor="middle" filter="url(#glow)">ॐ</text>
</svg>
